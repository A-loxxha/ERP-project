<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>ERP-Project</title>
</head>
<body>
    <nav class="nav-bar">
        <img src="/assets/Mipato_logo.png" alt="Mipato">
        <div class="user">
        <h1>Welcome, User</h1>
        <p>Here's whats happening in your store</p>
        </div>
        <div class="navigation">
            <!---<search>
                <img src="" alt="search"><input type="text" placeholder="search here">
            </search>--->
        </div>
    </nav>
    <section class="hero"></section>
    <section class="content">
        <div class="side-pannel">
            <button id="dashboardBtn">Dashboard</button>
            <button id="salesBtn">Sales Management</button>
            <button id="financeBtn">Finance and Accounts</button>
            <button id="customerBtn">CRM</button>
            <button id="inventoryBtn">Inventory Management</button>
        </div>
        <div class="content-wrapper">
            <div id="contentDashboard" class="content-dashboard">
                <div class="topsales">
                    <h1>Top Sales</h1>
                </div>
                <div class="daily-revenue">
                    <h1>Daily Revenue</h1>
                </div>
                <div class="business-health">
                    <h1>Business health</h1>
                </div>
            </div>
            <div class="content-sales">
                <h1>Sales</h1>
            </div>
            <div class="content-finance">
                <h1>Finance and Accounts</h1>
            </div>
            <div class="content-CRM">
                <h1>Customer Relationship Management</h1>
            </div>
            <div class="content-inventory">
                <h1>Inventory Management</h1>
            </div>
        </div>
    </section>
    <script src="/js/index.js"></script>

</html>
